name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Pick Gradle version
        id: gv
        run: |
          V=9.2.1
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            X=$(sed -n 's#.*gradle-\([0-9.]*\)-\(bin\|all\)\.zip.*#\1#p' gradle/wrapper/gradle-wrapper.properties | head -1)
            if [ -n "$X" ]; then V=$X; fi
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.version }}

      - name: Create Gradle wrapper if missing
        if: ${{ hashFiles('gradle/wrapper/gradle-wrapper.jar') == '' }}
        run: gradle wrapper --gradle-version ${{ steps.gv.outputs.version }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: delta-visuals-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
